[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=html
    --cov-report=term-missing:skip-covered
    --cov-fail-under=98
    --cov-branch

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests

filterwarnings =
    # beautifulsoup4 4.12 passes strip_cdata to lxml 6, which deprecated it.
    # Raised inside bs4, not in this project; scoped so our own warnings surface.
    ignore:The 'strip_cdata' option of HTMLParser:DeprecationWarning:bs4.builder._lxml
