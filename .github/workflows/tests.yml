name: Tests & Coverage

on:
  push:
    branches: [ "main", "develop", "claude/**" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: backend/requirements-dev.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements-dev.txt

    - name: Run tests with coverage
      # pytest.ini carries the coverage gate, so it applies here too.
      run: cd backend && pytest --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage.xml
        flags: backend
        name: backend-coverage

  frontend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18.x"]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: cd frontend && npm install

    - name: Run tests with coverage
      run: cd frontend && npm test -- --coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./frontend/coverage/coverage-final.json
        flags: frontend
        name: frontend-coverage

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "18.x"

    - name: Install linters
      run: |
        pip install ruff==0.14.5
        cd frontend && npm install

    - name: Lint backend (ruff)
      run: cd backend && ruff check src/ tests/ bench.py wsgi.py gunicorn.conf.py

    - name: Lint frontend (eslint)
      run: cd frontend && npx eslint public/js tests server.js bench.mjs

    - name: Verify OpenSpec exists
      run: test -f openspec/v1.0.yaml

    - name: Verify deployment entrypoints
      # Catch a Procfile or blueprint that references a file that does not exist.
      run: |
        test -f backend/wsgi.py
        test -f backend/gunicorn.conf.py
        test -f Procfile
        test -f render.yaml

  smoke:
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install runtime dependencies only
      # Proves the production dependency set is sufficient to boot: a runtime
      # import that only lives in requirements-dev.txt would fail here.
      run: pip install -r backend/requirements.txt

    - name: Boot under gunicorn and check the API
      env:
        ASSETFINDER_DB: /tmp/smoke.db
        PORT: "5000"
      run: |
        cd backend
        gunicorn --config gunicorn.conf.py wsgi:application &
        for i in $(seq 1 30); do
          curl -sf http://127.0.0.1:5000/api/health && break
          sleep 1
        done
        curl -sf http://127.0.0.1:5000/api/health | grep -q '"status":"ok"'
        curl -sf "http://127.0.0.1:5000/api/search?limit=5" | grep -q '"assets"'
        curl -sf http://127.0.0.1:5000/api/export | head -1 | grep -q '^id,type,description'
        echo "smoke test OK"
